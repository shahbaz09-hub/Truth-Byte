name: truthbyte

services:
  db:
    image: postgres:16-alpine
    container_name: truthbyte-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-truthbyte}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - truthbyte_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-truthbyte}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truthbyte-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://dpg-d83bm19kh4rs73aelieg-a.oregon-postgres.render.com:5432/truthbyte_db_m2hn?sslmode=require}
      DB_USERNAME: ${DB_USERNAME:-truthbyte_db_m2hn_user}
      DB_PASSWORD: ${DB_PASSWORD:-LPAQYo839YS1eG8YFBHpv9BBLWv6AzoV}
      SERVER_PORT: 8081
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_API_URL: ${GEMINI_API_URL:-https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
      GEMINI_FALLBACK_API_URL: ${GEMINI_FALLBACK_API_URL:-}
      GEMINI_REQUEST_TIMEOUT_MS: ${GEMINI_REQUEST_TIMEOUT_MS:-25000}
      GEMINI_RETRY_COUNT: ${GEMINI_RETRY_COUNT:-2}
      GEMINI_RETRY_DELAY_MS: ${GEMINI_RETRY_DELAY_MS:-1200}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-1024}
      AI_FALLBACK_ON_QUOTA: ${AI_FALLBACK_ON_QUOTA:-true}
      COMMUNITY_REPORT_CACHE_MINUTES: ${COMMUNITY_REPORT_CACHE_MINUTES:-15}
      JWT_SECRET: ${JWT_SECRET:-VGhpc0lzQURldk9ubHlKc3duVG9rZW5LZXlDaGFuZ2VJblByb2Q=}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8081}:8081"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: truthbyte-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  truthbyte_db_data:
