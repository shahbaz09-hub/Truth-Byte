spring:
  application:
    name: truthbyte-backend
  config:
    import: optional:file:.env[.properties]

  # Database Configuration
  datasource:
    url: ${DB_URL:${JDBC_DATABASE_URL:jdbc:postgresql://dpg-d74080dactks7386rk5g-a:5432/truthbyte_db}}
    username: ${DB_USERNAME:${DATABASE_USERNAME:truthbyte_db_user}}
    password: ${DB_PASSWORD:${DATABASE_PASSWORD:ze5bKdytkWIdrJSExRC0APOfJTH82Oz8}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: ${PORT:${SERVER_PORT:8081}}

truthbyte:
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
  security:
    jwt:
      secret: ${JWT_SECRET:VGhpc0lzQURldk9ubHlKc3duVG9rZW5LZXlDaGFuZ2VJblByb2Q=}
      expiration: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176}

logging:
  level:
    com.truthbyte: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
